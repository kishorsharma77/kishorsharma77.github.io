<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉग् इन् - Sanskrit Roots</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f1ea; padding: 20px; text-align: center; }
        .login-box { background: white; padding: 30px; max-width: 350px; margin: 80px auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #8b4513; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; width: 100%; }
        #msg { margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>छात्र लॉग् इन्</h2>
        <form id="loginForm">
            <input type="number" name="Phone" placeholder="WhatsApp नंबर" required>
            <input type="password" name="Password" placeholder="पासवर्ड" required>
            <input type="hidden" name="action" value="login">
            <button type="submit" id="loginBtn">प्रवेश करें</button>
        </form>
        <p id="msg"></p>
        <p style="margin-top:20px;">नया छात्र? <a href="register.html" style="color:#8b4513; font-weight:bold;">यहाँ रजिस्टर करें</a></p>
    </div>

   <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyDZATrLmZUQ95pmp0i5OAhxKlKE90PHm6qLNQKuWQ4kbvoCzASf5-rV20YzFmXApwb/exec';
    
    // 1. अगर छात्र पहले से लॉग् इन् है, तो सीधे पोर्टल पर भेजें
    if (localStorage.getItem("isLoggedIn") === "true") {
        window.location.href = "portal.html";
    }

    // 2. फॉर्म को केवल एक बार 'const' के साथ लिखें
    const loginFormElement = document.getElementById('loginForm');

    loginFormElement.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('msg').innerHTML = "प्रवेश किया जा रहा है...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(loginFormElement)})
        .then(response => response.text())
        .then(result => {
           // यहाँ बदलाव हुआ है: हम अब केवल "Success" नहीं, बल्कि डेटा भी चेक कर रहे हैं
                if(result.includes("Success")) {
                    
                    // डेटा को अलग-अलग टुकड़ों में बाँटना (Name, Course, Phone)
                    const userData = result.split("|"); 
                    
                    // छात्र की जानकारी ब्राउज़र की मेमोरी में सेव करना
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userName", userData[1]);   // छात्र का नाम
                    localStorage.setItem("userCourse", userData[2]); // छात्र का कोर्स
                    localStorage.setItem("userPhone", userData[3]);  // छात्र का फोन नंबर

                    // सीधे पोर्टल पर भेजें
                    window.location.href = "portal.html"; 
                } else {
                    document.getElementById('msg').innerHTML = "गलत नंबर या पासवर्ड!";
                    document.getElementById('msg').style.color = "red";
                }
            })
            .catch(error => {
                document.getElementById('msg').innerHTML = "सर्वर एरर!";
            });
        });

</script>
</body>
</html>
