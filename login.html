<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉग् इन् - Sanskrit Roots</title>
    <style>
        /* Top Navigation Bar Style */
.navbar {
    background-color: #8b4513;
    overflow: hidden;
    display: flex;
    justify-content: center;
    padding: 10px 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}
.navbar a {
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.3s;
    border-radius: 5px;
}
.navbar a:hover {
    background-color: #a0522d;
}
        body { font-family: sans-serif; background-color: #f4f1ea; padding: 20px; text-align: center; }
        .login-box { background: white; padding: 30px; max-width: 350px; margin: 80px auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #8b4513; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; width: 100%; }
        #msg { margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="index.html">🏠 मुख्य पृष्ठ (Home)</a>
    <a href="portal.html">🎓 छात्र पोर्टल (Portal)</a>
</nav>
    <div class="login-box">
        <h2>छात्र लॉग् इन्</h2>
        <form id="loginForm">
            <input type="number" name="Phone" placeholder="WhatsApp नंबर" required>
            <input type="password" id="passInput" name="Password" placeholder="पासवर्ड" required>
            <!-- Password Field के ठीक नीचे यह जोड़ें -->
<div style="text-align: left; margin-top: -5px; margin-bottom: 15px; font-size: 0.85rem;">
    <input type="checkbox" id="showPass" onclick="togglePassword()" style="width: auto; margin-right: 5px;">
    <label for="showPass" style="cursor: pointer;">पासवर्ड दिखाएं / Show Password</label>
</div>
            <input type="hidden" name="action" value="login">
            <button type="submit" id="loginBtn">प्रवेश करें</button>
        </form>
        <p id="msg"></p>
        <p style="margin-top:20px;">नया छात्र? <a href="register.html" style="color:#8b4513; font-weight:bold;">यहाँ रजिस्टर करें</a></p>
    </div>

  <script>
    // 1. यहाँ अपना 'AKfy...' वाला असली गूगल वेब ऐप URL पेस्ट करें
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzkoT4xHrPHtvzWR7OK9gUMdT1aOo6WwohnqC2NGKQgjIUedxLuRxBj9wYVrmdzrgv3/exec';

     // 1. पासवर्ड दिखाने वाला फंक्शन (Fetch के बाहर)
    function togglePassword() {
        var x = document.getElementsByName("Password")[0];
        if (x.type === "password") {
            x.type = "text";
        } else {
            x.type = "password";
        }
    }
      
    // 2. अगर पहले से लॉगिन है तो सीधे पोर्टल पर भेजें
    if (localStorage.getItem("isLoggedIn") === "true") {
        window.location.href = "portal.html";
    }

    const loginFormElement = document.getElementById('loginForm');

    loginFormElement.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('msg').innerHTML = "प्रवेश किया जा रहा है... कृपया प्रतीक्षा करें।";
        document.getElementById('msg').style.color = "blue";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(loginFormElement)})
        .then(response => response.text())
        .then(result => {
                console.log("Response from Google:", result); // जांच के लिए

                if(result.includes("Success")) {
                    const userData = result.split("|"); 
                    
                    // जानकारी सेव करने का सही क्रम (Google Sheet के अनुसार)
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userName",    userData[1]); // Name
                    localStorage.setItem("userPhone",   userData[2]); // Phone
                    localStorage.setItem("userEmail",   userData[3]); // Email
                    localStorage.setItem("userCourse",  userData[4]); // Course
                    localStorage.setItem("userStatus",  userData[5]); // Status
                    localStorage.setItem("userAddress", userData[6]); // Address
                    localStorage.setItem("userPhoto",   userData[7]); // Photo

                    window.location.href = "portal.html"; 
                } else {
                    document.getElementById('msg').innerHTML = "गलत नंबर या पासवर्ड! / Incorrect Login!";
                    document.getElementById('msg').style.color = "red";
                }
  
            })
            .catch(error => {
                document.getElementById('msg').innerHTML = "सर्वर एरर! इंटरनेट चेक करें।";
                document.getElementById('msg').style.color = "red";
            });
        });
</script>
</body>
</html>
