<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskrit Roots - My Profile & Payment</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f1ea; padding: 20px; text-align: center; }
        
        .profile-card { 
            background: white; 
            padding: 30px; 
            max-width: 500px; 
            margin: 20px auto; 
            border-radius: 15px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            border-top: 8px solid #8b4513; 
        }

        h2 { color: #8b4513; margin-bottom: 25px; border-bottom: 2px solid #f4eae1; padding-bottom: 10px; }

        /* Left-Right Alignment Logic */
        .info-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 0; 
            border-bottom: 1px solid #f2f2f2; 
            text-align: left;
        }

        .label { font-weight: bold; color: #666; flex: 1; }
        .data { font-weight: bold; color: #333; flex: 1.5; text-align: right; word-wrap: break-word; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }
        .active-status { background-color: #d4edda; color: #155724; }
        .pending-status { background-color: #fff3cd; color: #856404; }

        /* Payment Section Styles */
        .payment-section { margin-top: 30px; background: #fdf8f0; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .course-select { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #8b4513; border-radius: 8px; font-size: 1rem; }
        
        .btn-pay { display: none; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 10px 0; color: white; font-size: 1.1rem; transition: 0.3s; }
        .upi-btn { background: #28a745; }
        .upi-btn:hover { background: #218838; }
        .paypal-btn { background: #003087; }
        .paypal-btn:hover { background: #00256a; }

        .note { font-size: 0.8rem; color: #666; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2>👤 छात्र प्रोफाइल (Profile)</h2>
        
        <div class="info-row">
            <span class="label">👤 नाम:</span>
            <span class="data" id="uName">...</span>
        </div>

        <div class="info-row">
            <span class="label">📞 फोन:</span>
            <span class="data" id="uPhone">...</span>
        </div>

        <div class="info-row">
            <span class="label">📚 कोर्स:</span>
            <span class="data" id="uCourse" style="color: #8b4513;">...</span>
        </div>

        <div class="info-row" style="border-bottom: none;">
            <span class="label">✅ स्टेटस:</span>
            <span class="data">
                <span id="uStatus" class="status-badge">...</span>
            </span>
        </div>

        <div class="payment-section">
            <h3 style="margin-top: 0; color: #8b4513;">💳 फीस भुगतान (Payment)</h3>
            <p style="font-size: 0.9rem;">कोर्स चुनें और भुगतान का माध्यम चुनें:</p>
            
            <select id="courseSelect" class="course-select" onchange="updateLinks()">
                <option value="">-- कोर्स चुनें --</option>
                <option value="5000">UGC NET Sanskrit (₹5000 / $75)</option>
                <option value="1500">Basic Sanskrit (₹1500 / $25)</option>
                <option value="1000">Stotra Learning (₹1000 / $15)</option>
            </select>

            <div id="payButtons" style="display: none;">
                <!-- UPI Link for India -->
                <a id="upiLink" href="#" class="btn-pay upi-btn">
                   🇮🇳 Pay via UPI (India)
                </a>

                <!-- PayPal Link for International -->
                <a href="https://www.paypal.com/ncp/payment/UULBJHGHKXC5L" target="_blank" class="btn-pay paypal-btn" style="display: block;">
                   🌎 Pay via PayPal (Intl)
                </a>
                
                <p class="note"><strong>नोट:</strong> भुगतान के बाद रसीद का स्क्रीनशॉट व्हाट्सएप या ईमेल पर ज़रूर भेजें।</p>
            </div>
        </div>

        <br>
        <a href="portal.html" style="color: #8b4513; text-decoration: none; font-weight: bold;">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script>
        // 1. डेटा लोड करना
        document.getElementById("uName").innerText = localStorage.getItem("userName") || "N/A";
        document.getElementById("uPhone").innerText = localStorage.getItem("userPhone") || "N/A";
        document.getElementById("uCourse").innerText = localStorage.getItem("userCourse") || "N/A";
        
        const status = localStorage.getItem("userStatus");
        const statusEl = document.getElementById("uStatus");
        statusEl.innerText = status || "Registered";
        statusEl.classList.add(status === "Active" ? "active-status" : "pending-status");

        // 2. पेमेंट लिंक अपडेट करना
        function updateLinks() {
            const amount = document.getElementById("courseSelect").value;
            const payDiv = document.getElementById("payButtons");
            const upiBtn = document.getElementById("upiLink");

            if(amount) {
                payDiv.style.display = "block";
                
                // UPI Link Logic (sharmakishor77-2@okicici)
                const vpa = "sharmakishor77-2@okicici";
                const name = "Dr Kishor Kumar";
                upiBtn.href = `upi://pay?pa=${vpa}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
                upiBtn.style.display = "block";
            } else {
                payDiv.style.display = "none";
            }
        }
    </script>
</body>
</html>
