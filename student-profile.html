<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Sanskrit Roots - Payment & Profile</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f1ea; padding: 20px; text-align: center; }
        .payment-card { background: white; padding: 30px; max-width: 500px; margin: 20px auto; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 8px solid #8b4513; }
        .user-info { background: #fdf8f0; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border: 1px solid #eee; }
        .course-selector { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #8b4513; border-radius: 8px; font-size: 1rem; }
        
        /* Payment Buttons */
        .btn-pay { display: none; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 10px 0; color: white; font-size: 1.1rem; }
        .upi-btn { background: #28a745; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .paypal-btn { background: #003087; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .qr-placeholder { margin-top: 20px; padding: 15px; border: 1px dashed #ccc; display: none; }
    </style>
</head>
<body>

    <div class="payment-card">
        <h2>💳 फीस एवं प्रोफाइल</h2>
        
        <!-- छात्र की जानकारी -->
        <div class="user-info">
            <p><strong>नाम:</strong> <span id="uName">...</span></p>
            <p><strong>कोर्स:</strong> <span id="uCourse">...</span></p>
            <p><strong>स्टेटस:</strong> <span id="uStatus">...</span></p>
        </div>

        <hr>

        <h3>कोर्स चुनें (Select Course)</h3>
        <select id="courseSelect" class="course-selector" onchange="showPayments()">
            <option value="">-- कोर्स चुनें --</option>
            <option value="NET" data-inr="5000" data-usd="75">UGC NET Sanskrit (₹5000 / $75)</option>
            <option value="BASIC" data-inr="1500" data-usd="25">Basic Sanskrit (₹1500 / $25)</option>
            <option value="STOTRA" data-inr="1000" data-usd="15">Stotra Learning (₹1000 / $15)</option>
        </select>

        <!-- भुगतान बटन -->
        <div id="paymentMethods" style="display: none;">
            <p style="font-weight: bold; color: #8b4513;">भुगतान का माध्यम चुनें:</p>
            
            <!-- UPI Button (For India) -->
            <a id="upiLink" href="#" class="btn-pay upi-btn">
                🇮🇳 Pay via UPI (GPay/PhonePe)
            </a>

            <!-- PayPal Button (International) -->
            <a id="paypalLink" href="#" target="_blank" class="btn-pay paypal-btn">
                🌎 Pay via PayPal (International)
            </a>

            <div class="qr-placeholder" id="qrNote">
                <p>भुगतान के बाद रसीद का स्क्रीनशॉट व्हाट्सएप पर ज़रूर भेजें।</p>
            </div>
        </div>

        <br>
        <a href="portal.html" style="color: #8b4513;">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script>
        // छात्र डेटा लोड करना
        document.getElementById("uName").innerText = localStorage.getItem("userName");
        document.getElementById("uCourse").innerText = localStorage.getItem("userCourse");
        document.getElementById("uStatus").innerText = localStorage.getItem("userStatus");

        function showPayments() {
            const select = document.getElementById("courseSelect");
            const selectedOption = select.options[select.selectedIndex];
            const methods = document.getElementById("paymentMethods");
            
            if (select.value === "") {
                methods.style.display = "none";
                return;
            }

            methods.style.display = "block";
            const inrAmt = selectedOption.getAttribute("data-inr");
            const usdAmt = selectedOption.getAttribute("data-usd");

            // 1. UPI Link Setup (अपनी UPI ID यहाँ बदलें)
            const upiId = "sharma@okicici"; 
            const upiName = "Dr Kishor Kumar";
            document.getElementById("upiLink").href = `upi://pay?pa=${upiId}&pn=${upiName}&am=${inrAmt}&cu=INR`;
            document.getElementById("upiLink").style.display = "flex";

            // 2. PayPal Link Setup (अपना PayPal.me लिंक यहाँ बदलें)
            const paypalId = "sharmakishor77"; 
            document.getElementById("paypalLink").href = `https://www.paypal.me/${paypalId}/${usdAmt}USD`;
            document.getElementById("paypalLink").style.display = "flex";
            
            document.getElementById("qrNote").style.display = "block";
        }
    </script>
</body>
</html>
