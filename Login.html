<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>लॉगिन - Sanskrit Roots</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f1ea; padding: 20px; text-align: center; }
        .login-box { background: white; padding: 30px; max-width: 350px; margin: 80px auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #8b4513; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>छात्र लॉगिन</h2>
        <form id="loginForm">
            <input type="number" name="Phone" placeholder="WhatsApp नंबर" required>
            <input type="password" name="Password" placeholder="पासवर्ड" required>
            <input type="hidden" name="action" value="login">
            <button type="submit" id="loginBtn">प्रवेश करें</button>
        </form>
        <p id="msg"></p>
        <p>नया छात्र? <a href="register.html">यहाँ रजिस्टर करें</a></p>
    </div>

    <script>
        const scriptURL = 'यहाँ_अपना_नया_WEB_APP_URL_डालें'
        const form = document.getElementById('loginForm')

        form.addEventListener('submit', e => {
            e.preventDefault()
            document.getElementById('msg').innerHTML = "चेक किया जा रहा है..."
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => response.text())
            .then(result => {
                if(result === "Success") {
                    // लॉगिन सफल होने पर छात्र का नाम 'session' में सेव कर लेते हैं
                    localStorage.setItem("isLoggedIn", "true");
                    window.location.href = "portal.html"; 
                } else {
                    document.getElementById('msg').innerHTML = "गलत नंबर या पासवर्ड!";
                    document.getElementById('msg').style.color = "red";
                }
            })
        })
    </script>
</body>
</html>
