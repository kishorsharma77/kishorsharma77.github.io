<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskrit Roots Portal</title>
    <style>
        .logout-btn { position: absolute; top: 20px; right: 20px; background-color: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 100; }
        .logout-btn:hover { background-color: #cc0000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f1ea; margin: 0; padding: 20px; text-align: center; }
        .header { background-color: #8b4513; color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 5px solid #8b4513; transition: 0.3s; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #8b4513; }
        .btn { display: inline-block; padding: 10px 20px; background: #8b4513; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        
        /* लॉक किए गए कार्ड का स्टाइल */
        .locked-card { opacity: 0.6; pointer-events: none; filter: grayscale(1); }
        .status-alert { background: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffeeba; font-weight: bold; }
    </style>
</head>
<body>
